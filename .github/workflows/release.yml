# Tests every push to `tube`, and releases when the version in app.json has no release yet:
# builds the signed APK on EAS and publishes it as a GitHub pre-release.
#
# One-time setup for releases: add a repository secret named EXPO_TOKEN (expo.dev -> Account
# settings -> Access tokens), under Settings -> Secrets and variables -> Actions. Until it is
# there the tests still run and the release is skipped with a notice; re-run the job once the
# secret is added. A version that already has a release is left alone, so re-running is safe.
name: Release

on:
  push:
    branches: [tube]
  pull_request:
    branches: [tube]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EAS_TOKEN || secrets.EXPO_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: |
          npm test
          npm run typecheck
          npm run lint

      # Decide whether this run releases: only pushes to tube (or a manual run), only for a
      # version without a release, and only once the Expo token is configured.
      - name: Plan the release
        id: plan
        run: |
          version=$(node -p "require('./app.json').expo.version")
          tag="v${version}-tube"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "apk=tube-v${version}.apk" >> "$GITHUB_OUTPUT"
          release=false
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            note="Pull request: tests only."
          elif gh release view "$tag" >/dev/null 2>&1; then
            note="Release $tag already exists; nothing to build."
          elif [ -z "$EXPO_TOKEN" ]; then
            note="Release $tag NOT built: add a repository secret named EXPO_TOKEN (expo.dev -> Account settings -> Access tokens), then re-run this job."
            echo "::warning title=Release skipped::$note"
          else
            note="Building and publishing $tag."
            release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "$note"
          echo "### $note" >> "$GITHUB_STEP_SUMMARY"

      # Outputs go to the runner's temp folder: EAS uploads the working tree as it is.
      - name: Build on EAS
        if: steps.plan.outputs.release == 'true'
        run: |
          npx --yes eas-cli@latest build --platform android --profile preview \
            --non-interactive --wait --json \
            --message "${{ steps.plan.outputs.tag }}" > "$RUNNER_TEMP/build.json"
          node scripts/release/artifact-url.mjs "$RUNNER_TEMP/build.json" > "$RUNNER_TEMP/artifact-url.txt"
          echo "Build artifact: $(cat "$RUNNER_TEMP/artifact-url.txt")"

      - name: Download the APK
        if: steps.plan.outputs.release == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL --retry 3 --max-time 600 -o "${{ steps.plan.outputs.apk }}" "$(cat artifact-url.txt)"
          ls -la "${{ steps.plan.outputs.apk }}"
          sha256sum "${{ steps.plan.outputs.apk }}" | tee apk.sha256

      - name: Publish the release
        if: steps.plan.outputs.release == 'true'
        run: |
          node scripts/release/notes.mjs "${{ steps.plan.outputs.version }}" "$(cut -d' ' -f1 "$RUNNER_TEMP/apk.sha256")" > "$RUNNER_TEMP/notes.md"
          title=$(node scripts/release/notes.mjs "${{ steps.plan.outputs.version }}" --title)
          gh release create "${{ steps.plan.outputs.tag }}" "$RUNNER_TEMP/${{ steps.plan.outputs.apk }}" \
            --target "$GITHUB_SHA" --prerelease --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          echo "### Published ${{ steps.plan.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
